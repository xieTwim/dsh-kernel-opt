# kernel-opt bundle patch: mounts the Node half (the kernel loop, the
# series/control/models routes, the preset install, and the resolved-config
# service the mode's tools read). The browser half is discovered through this
# package's `dsh.client` declaration — no extra row.
#
# The model-facing tools are NOT mounted here. kernel_plan / kernel_env /
# kernel_finalize / self_compact are levers of 「算子优化模式」 alone, so they
# are rows of that preset's own composition (`@xietwim/dsh-kernel-opt/agent`
# and `/self-compact`); mounting them here put their descriptions in every
# unrelated session's tool catalog. The config below still governs them.
#
# Optional config keys (defaults shown; any bench tooling works):
#   benchTools:    ['kernel_evaluate']
#   profileTools:  ['kernel_profile']
#   finalizeTools: ['run_finalize', 'kernel_finalize']
- insert:
    - id: kernel-opt
      name: '@xietwim/dsh-kernel-opt'
