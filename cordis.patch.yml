# kernel-cockpit bundle patch: mounts the Node half (cockpit_plan /
# self_compact tools + the per-session series route). The browser half is
# discovered through this package's `dsh.client` declaration — no extra row.
#
# Optional config keys (all default to the AKO runtime MCP tool names):
#   benchTools:    ['kernel_evaluate']
#   profileTools:  ['kernel_profile']
#   finalizeTools: ['run_finalize']
- insert:
    - id: kernel-cockpit
      name: '@xsyshuishui/dsh-kernel-cockpit'
