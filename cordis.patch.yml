# kernel-opt bundle patch: mounts the Node half (kernel_plan / kernel_finalize
# tools, the kernel loop, and the series/control/models routes). The browser
# half is discovered through this package's `dsh.client` declaration — no
# extra row.
#
# Optional config keys (defaults shown; any bench tooling works):
#   benchTools:    ['kernel_evaluate']
#   profileTools:  ['kernel_profile']
#   finalizeTools: ['run_finalize', 'kernel_finalize']
- insert:
    - id: kernel-opt
      name: '@xietwim/dsh-kernel-opt'
